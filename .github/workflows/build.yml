name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Zip Example Pack
      run: zip -r example_resource_pack.zip example_pack

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: edge-glow-build
        path: |
          build/libs/*.jar
          example_resource_pack.zip
